name: merya-rates

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Scrape rates
        run: node scrape.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot-*.png
          if-no-files-found: ignore

      - name: Commit rates.json
        if: success()
        run: |
          git config user.name  'merya-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add rates.json
          git commit -m 'rates update' || echo 'no change'
          git push
