name: merya-rates

on:
  schedule:
    # 01:00 UTC = 04:00 Riyadh; the 120-night scrape takes ~1.5h and must
    # finish before Respond.io re-syncs the pages at 09:00 Riyadh
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Scrape rates
        id: scrape
        continue-on-error: true
        run: node scrape.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot-*.png
          if-no-files-found: ignore

      - name: Build rates page
        if: always()
        continue-on-error: true
        run: node make-page.js

      - name: Commit rates.json
        if: always()
        run: |
          git config user.name  'merya-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add rates.json docs || true
          git commit -m 'rates update' || echo 'no change'
          git push || true
